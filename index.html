  var STORAGE_KEY = 'bcpPopupShown';
  if (sessionStorage.getItem(STORAGE_KEY)) return;

  var popup = document.getElementById('bcp-popup');
  var overlay = document.getElementById('bcp-overlay');
  var iframe = document.getElementById('bcp-iframe');
  var btnYes = document.getElementById('bcp-btn-yes');

    popup.classList.add('visible');

  btnYes.addEventListener('click', function() {
    popup.classList.remove('visible');
  });

    popup.classList.remove('visible');
